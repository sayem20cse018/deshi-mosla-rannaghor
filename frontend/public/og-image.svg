<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f4c2a"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#072d18;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Logo circle -->
  <rect x="80" y="80" width="100" height="100" rx="24" fill="rgba(255,255,255,0.15)"/>
  <text x="130" y="148" text-anchor="middle" fill="white" font-size="48" font-weight="bold" font-family="sans-serif">দ</text>
  <!-- Main title -->
  <text x="80" y="320" fill="white" font-size="72" font-weight="900" font-family="sans-serif">দেশি মসলার রান্নাঘর</text>
  <text x="80" y="400" fill="rgba(255,255,255,0.7)" font-size="36" font-family="sans-serif">Deshi Moslar Rannaghar</text>
  <text x="80" y="490" fill="rgba(255,255,255,0.6)" font-size="28" font-family="sans-serif">১০০% খাঁটি দেশীয় মসলা ও গ্রোসারি</text>
  <!-- Orange accent bar -->
  <rect x="80" y="540" width="200" height="8" rx="4" fill="#ea580c"/>
  <!-- Emoji decorations -->
  <text x="950" y="250" font-size="120" opacity="0.15">🌶️</text>
  <text x="1050" y="450" font-size="80" opacity="0.1">🫙</text>
  <text x="850" y="480" font-size="80" opacity="0.1">🍯</text>
</svg>