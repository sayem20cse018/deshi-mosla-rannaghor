[phases.setup]
nixPkgs = ["nodejs_20", "openssl", "openssl.dev"]

[phases.install]
cmds = ["npm install --include=dev", "npx prisma generate"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx prisma migrate resolve --rolled-back 20261021121449_add_collections_variants 2>/dev/null || true && npx prisma migrate deploy && node dist/src/main"